# 示例：预发自动化部署（供拷贝到「业务项目」仓库）
#
# 用法：
# 1. 在目标 GitHub 仓新建：.github/workflows/deploy-staging.yml
# 2. 把本文件内容粘贴进去并按需改「部署步骤」
# 3. 在 ZR WorkBuddy「系统配置 → 自动化部署」填写：
#    - GitHub 仓库：owner/repo
#    - Workflow 文件名：deploy-staging.yml
#    - Token：能触发该仓 Actions 的 PAT
# 4. 对话说「部署到预发」→ 确认卡 → 本流水线被 workflow_dispatch 触发
#
# 注意：
# - 必须保留 on.workflow_dispatch，否则 WorkBuddy 无法手动触发
# - 下面「部署到服务器」步骤是占位；按你们真实方式改（SSH / 镜像 / k8s）
# - 本文件默认不写死任何生产主机密钥；密钥请放在仓库 Settings → Secrets

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "目标环境（WorkBuddy 会传入 staging）"
        required: false
        default: "staging"
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: |
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "environment=${{ inputs.environment || 'staging' }}"

