[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zr-gateway"
version = "0.1.0"
description = "Company model gateway: MES-backed login, alias routing, and OpenAI-compatible streaming for the desktop app."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["zr_gateway"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
